name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: [self-hosted, deadair-ci]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run deps:circular

  test:
    name: Test
    runs-on: [self-hosted, deadair-ci]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --ci --coverage --coverage.reporter=text-summary

  godot-test:
    name: Godot Tests
    runs-on: [self-hosted, deadair-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Ensure Godot 4.7-stable
        run: |
          # The desktop export in godot-release.yml pins 4.7-stable, so tests must
          # run the same build rather than whatever 4.7.x happens to be on the runner.
          GODOT_BIN_SHA256=f85bbc6b15e22416c7d797cd60b63286dd67b9cb13498847056c18520ae55a75
          if ! godot --version 2>/dev/null | grep -q '^4\.7\.stable\.official' \
             || [ "$(sha256sum /usr/local/bin/godot | cut -d' ' -f1)" != "$GODOT_BIN_SHA256" ]; then
            curl -sL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
            echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  godot.zip" | sha256sum -c -
            unzip -q godot.zip
            chmod +x Godot_v4.7-stable_linux.x86_64
            sudo mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          fi
          test "$(sha256sum /usr/local/bin/godot | cut -d' ' -f1)" = "$GODOT_BIN_SHA256" || {
            echo "installed engine does not match the pinned 4.7-stable build" >&2
            exit 1
          }
          godot --version
      - name: Import project
        working-directory: godot
        run: godot --headless --import 2>&1 | tail -5
      - name: Run test suite
        id: tests
        working-directory: godot
        run: |
          set +e
          ATTEMPT_TIMEOUT_SECONDS=120
          MAX_ATTEMPTS=5
          GODOT_EXIT=1
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Godot test suite (attempt $attempt/$MAX_ATTEMPTS)"
            timeout --signal=TERM --kill-after=10s "${ATTEMPT_TIMEOUT_SECONDS}s" \
              godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee test_output.log
            GODOT_EXIT=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$GODOT_EXIT" -ne 124 ]; then
              break
            fi
            echo "::warning::Godot test suite hung for ${ATTEMPT_TIMEOUT_SECONDS}s (last suite: $(grep 'Running ' test_output.log | tail -1)); retrying"
            pkill -f "godot --headless" 2>/dev/null || true
            sleep 2
          done
          set -e
          pkill -f "godot --headless" 2>/dev/null || true
          if [ "$GODOT_EXIT" -eq 124 ]; then
            echo "::error::Godot test suite hung on every attempt (last suite: $(grep 'Running ' test_output.log | tail -1))"
            exit 1
          fi
          TOTAL=$(grep -oP 'Total: \K[0-9]+' test_output.log | tail -1)
          PASSED=$(grep -oP 'Passed: \K[0-9]+' test_output.log | tail -1)
          FAILED=$(grep -oP 'Failed: \K[0-9]+' test_output.log | tail -1)
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          if [ -z "$TOTAL" ]; then
            echo "::error::Godot test runner produced no summary line"
            exit 1
          fi
          if [ "$FAILED" -gt 28 ]; then
            echo "::error::Godot test failures ($FAILED) exceed the known baseline of 28"
            exit 1
          fi
          exit 0
      - name: Summary
        if: always()
        run: |
          echo "Godot tests: ${{ steps.tests.outputs.passed }}/${{ steps.tests.outputs.total }} passed, ${{ steps.tests.outputs.failed }} failures (baseline 28)" >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security Scan
    runs-on: [self-hosted, deadair-ci]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Trivy secret scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest fs \
            --scanners secret --severity HIGH,CRITICAL --exit-code 1 .

  web-build:
    name: Web Build
    runs-on: [self-hosted, deadair-ci]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: web-dist
          path: dist
          retention-days: 14
