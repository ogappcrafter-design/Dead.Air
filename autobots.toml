[autobots]
model_selection_profile = "quality"
parallel_planning = false
disable_live_catalog = true
safety_branch = "autobots/dar-phase-1"
default_mode = "autonomous"
milestone_threshold = 3
max_verification_attempts = 3
temperature = 0.2
max_tokens = 16384
model_registry_path = "autobots-model-registry.json"

test_gate = true
test_command = "pnpm test -- --passWithNoTests"
test_timeout = 120

auto_commit = true
